name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires et base de données (JVM + Robolectric)
        id: tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee tests.log

      - name: Bilan des tests
        if: always()
        run: python3 .github/scripts/test_summary.py

      - name: Compilation de l'APK
        id: apk
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee apk.log
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SmartBudgetFC.apk

      # Rend les erreurs lisibles sans connexion (annotations publiques du check-run)
      - name: Résumé des erreurs
        if: failure()
        run: python3 .github/scripts/report_errors.py

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/schemas/
          if-no-files-found: ignore

      - name: APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartBudgetFC-apk
          path: dist/SmartBudgetFC.apk

      # Publie l'APK sur une page de téléchargement stable (Releases > dev-latest)
      - name: Publier l'APK (dev-latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --cleanup-tag -y || true
          gh release create dev-latest dist/SmartBudgetFC.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "SmartBudget FC - version de développement" \
            --notes "APK compilé automatiquement depuis le commit $GITHUB_SHA. Tous les tests unitaires ont réussi avant la compilation."

  # Test de bout en bout sur un vrai Android (émulateur API 29) + captures d'écran publiées avec l'APK.
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compiler l'APK et l'APK de test
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest 2>&1 | tee apk.log

      - name: Erreurs de compilation (test)
        if: failure()
        run: python3 .github/scripts/report_errors.py

      - name: Test de bout en bout sur émulateur
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/emulator_smoke.sh

      - name: Bilan émulateur
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          log = open('instrument.log', encoding='utf-8', errors='replace').read() if os.path.exists('instrument.log') else 'instrument.log absent'
          crash = open('crash.log', encoding='utf-8', errors='replace').read() if os.path.exists('crash.log') else ''
          ok = re.search(r'^OK \(', log, re.M) is not None
          shots = sorted(os.listdir('screens')) if os.path.isdir('screens') else []
          tail = '\n'.join(log.strip().splitlines()[-60:])
          msg = f"Résultat : {'OK' if ok else 'ÉCHEC'} | captures : {len(shots)}\n{tail}\n--- crash ---\n{crash[-4000:]}"
          esc = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::{'notice' if ok else 'error'} title=Test emulateur::{esc[:60000]}")
          PY

      - name: Publier les captures d'écran
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls screens/*.png >/dev/null 2>&1; then
            gh release upload dev-latest screens/*.png --clobber
          fi
